name: bikynav
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.5.4

dependencies:
  animate_do: ^3.3.4
  bloc: ^8.1.4
  cloud_firestore: ^5.5.0
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  equatable: ^2.0.5
  firebase_auth: ^5.3.3
  firebase_core: ^3.8.0
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  flutter_launcher_icons: ^0.14.2
  geolocator: ^13.0.1
  go_router: ^14.6.0
  google_maps_flutter: ^2.9.0
  google_polyline_algorithm: ^3.1.0
  geolocator_platform_interface: 4.2.6
  http: ^1.2.2
  intl: ^0.20.1
  mobile_scanner: ^6.0.7
  permission_handler: ^11.4.0
  provider: ^6.1.2
  qr_flutter: ^4.1.0
  socket_io_client: ^3.0.2

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/
    - assets/markers/

flutter_icons:
  android: true
  ios: true
  image_path: "./assets/images/logo.png"
  android_icon_name: "launcher"
